<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmCo - NS</title>
<style>
body {
  background-image: url('images/meat-cropped.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  /* center the card on the page */
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;

  /* leave room for the fixed navbar so it never covers the card */
  padding-top: 72px;
  box-sizing: border-box;
}

/* ---------- Navbar ---------- */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: rgba(0, 0, 0, 0.55);
  border-bottom: 1px solid rgb(0, 255, 55);
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
  width: 100%;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 1000;
  padding-left: 20px;
  padding-right: 20px;
  box-sizing: border-box;
}

.navbar-left {
  display: flex;
  align-items: center;
}

.navbar-right {
  margin-right: 0;
  padding-right: 0;
}

.navbar span {
  background: linear-gradient(to bottom, #e3e3e3, #eeeeee);
  margin: 10px;
  font-size: 20px;
  cursor: pointer;
  border-radius: 5px;
  border: 1px solid rgb(0, 255, 55);
  padding: 2px;
}

.manual-link {
  align-items: center;
}

.SelectedTab {
  border: 3px solid rgb(0, 255, 55);
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
}

/* 500 x 500 square, split top / bottom */
.card {
  width: 500px;
  height: 500px;
  flex: none;
  box-sizing: border-box;
  border: 4px solid #ff0000; /* bright red border */
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.85);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

/* TOP HALF: 16:9 video (500px wide -> ~281px tall) */
.video {
  width: 100%;
  aspect-ratio: 16 / 9;
  flex: none;
  background: #000;
}

.video iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

/* WHITE LINE between the two halves */
.divider {
  height: 2px;
  flex: none;
  background: #fff;
}

/* BOTTOM HALF: title + description */
.info {
  flex: 1;
  min-height: 0;
  padding: 14px 18px;
  color: #fff;
  overflow-y: auto;
}

.info h2 {
  margin: 0 0 8px;
  font-size: 1.25rem;
  line-height: 1.2;
}

.info p {
  margin: 0;
  font-size: 0.9rem;
  line-height: 1.45;
}
</style>
</head>
<body>

  <!-- NavBar -->
  <div class="navbar">
      <div class="navbar-left">
          <a href="navigation.html"><img src="images/logo.png" height="40px"></a>
          <span><a onclick="tba()">Main</a></span>
          <span class="SelectedTab"><a href="neutralstrawberry.html">Episodes</a></span>
          <span><a onclick="tba()">Characters</a></span>
      </div>
      <span class="navbar-right manual-link"><a onclick="tba()">TBA</a></span>
  </div>

  <div class="card">
    <div class="video">
      <iframe
        id="player"
        title="Video player"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen></iframe>
    </div>

    <div class="divider"></div>

    <div class="info">
      <h2 id="video-title"></h2>
      <p id="video-description"></p>
    </div>
  </div>

<script>
function wip() {
 alert("This Feature Is Still A Work In Progress")
}
function tba() {
 alert("This Feature Will Come In A Future Update")
}

/* ------------------------------------------------------------
   HOW IT WORKS
   watch?id=1  ->  the iframe loads the src (web address) of entry "1" below
                   title + description come from the list below.

   To add a video:
     1. Host the video on the web (use a direct link to the video)
     2. Add an entry with that id below and paste the video's address in src.
   ------------------------------------------------------------ */
const VIDEO_BASE_URL = ""; // optional: if all videos share one web folder, put it here (must end with /), e.g. "https://example.com/videos/"
const VIDEO_EXT = ".mp4";
const DEFAULT_ID = "1"; // used when the URL has no ?id=

const videos = {
  "1":  { title: "Pilot",  description: "S1 E1", src: "https://cdn.rapidfile.cc/25sWx0hEIb/1.mp4" },
  "2":  { title: "Neutral Strawberry Meets Joyful Plum",  description: "S1 E2", src: "https://cdn.rapidfile.cc/ZMtbMDTOfD/2.mp4" },
  "3":  { title: "three",  description: "S1 E3", src: "https://ajxbhgmnzcmnkbzw.public.blob.vercel-storage.com/3.mp4" },
  "4":  { title: "???",  description: "S1 E3.5", src: "https://cdn.rapidfile.cc/eqXPVjAAJA/4.mp4" },
  "5":  { title: "???",  description: "S1 E4 (Definitive Edition)", src: "https://cdn.rapidfile.cc/7iNbzzYaM8/5.mp4" },
  "6":  { title: "???",  description: "S1 E4.5", src: "https://cdn.rapidfile.cc/A6t5y4FdS8/NSE4.5.mp4" },
  "7":  { title: "The Neutral Strawberry Semi-Finale",  description: "S1 E4.75", src: "https://cdn.rapidfile.cc/Du0cfgOTvZ/7.mp4" },
  "8":  { title: "The Neutral Strawberry Grand Finale",  description: "S1 E5", src: "https://ajxbhgmnzcmnkbzw.public.blob.vercel-storage.com/8.mp4" },
  "9":  { title: "four",  description: "THIS EPISODE IS NO LONGER CANON TO THE SERIES", src: "https://cdn.rapidfile.cc/iHlsWfwiLS/9.mp4" },
  "10": { title: "five",  description: "THIS EPISODE IS NO LONGER CANON TO THE SERIES", src: "https://ajxbhgmnzcmnkbzw.public.blob.vercel-storage.com/10.mp4" },
  "11": { title: "(the) shitful strawberry cessation", description: "THIS EPISODE IS NOT CANON TO THE SERIES, IT WAS ONLY MADE AS A QUICK CONCLUSION TO THE SERIES.", src: "https://ajxbhgmnzcmnkbzw.public.blob.vercel-storage.com/11.mp4" },
  "12": { title: "A Special Announcement From Neutral Strawberry!", description: "This Video Is Not Canon To The Series, It Is A Celabratory Video For Reaching The Milestone Of 50 Followers On TikTok.", src: "https://cdn.rapidfile.cc/lGLMXtIt6b/12.mp4" },
  "13": { title: "Neutral Strawberry Has Another Special Announcement!", description: "This Video Is Not Canon To The Series, It Is A Celabratory Video For Reaching The Milestone Of 100 Followers On TikTok.", src: "https://cdn.rapidfile.cc/OkCDkY6Zrd/13.mp4" },
  "14": { title: "Test (i regret making this)", description: "THIS VIDEO HAS BARELY ANYTHING TO DO WITH NEUTRAL STRAWBERRY, IT WAS UPLOADED TO THE NEUTRAL STRAWBERRY ACCOUNT BECUASE THERE WAS A UPLOADING ISSUE ON THE TIKTOK WEBSITE.", src: "https://cdn.rapidfile.cc/ffwUXPn6zN/14.mp4" },
  "15": { title: "Neutral Strawberry's 3rd Announcement!", description: "This Video Is Not Canon To The Series, It Is A Celabratory Video For Reaching The Milestone Of 300 Followers On TikTok.", src: "https://cdn.rapidfile.cc/N57bEpoTgS/15.mp4" },
  "16": { title: "Neutral Strawberry Episode 3 Trailer", description: "This Video Is Not Canon To The Series, It Is A Trailer For Episode 3.", src: "https://cdn.rapidfile.cc/Juh8XCXZlW/16.mp4" },
  "17": { title: "Neutral Strawberry Is Returning, But Only Until April 25th. It's Because Of The Sora Shutdown.", description: "This Video Was A Announcement For The Continuation Of Neutral Strawberry", src: "https://cdn.rapidfile.cc/qpQ8sCE5gC/17.mp4" },
  "18": { title: "a final announcement.", description: "This Video Is A Announcement For The Cancellation Of Neutral Strawberry The True Grand Finale Which Was A Planned Definitive Finale For Neutral Strawberry That Got Cancelled Because Of Creators Block", src: "https://cdn.rapidfile.cc/4K2I6UHSNp/18.mp4" },
  "19": { title: "???", description: "This Video Was A Announcement For The End Of Neutral Strawberry (Because At The Time Many Joyful Plum Parody Accounts Were Quitting And Various Changes Were Happenning)", src: "https://cdn.rapidfile.cc/pal4kPo6Vf/NS's%20End-copy.mp4" },
  // src = that video's web address (paste it between the quotes).
  // If src is blank, VIDEO_BASE_URL + <id>.mp4 is used instead (only if you set VIDEO_BASE_URL above).
};

const params = new URLSearchParams(window.location.search);
const id = params.get("id") || DEFAULT_ID;
const video = videos[id];

const player = document.getElementById("player");
const titleEl = document.getElementById("video-title");
const descEl = document.getElementById("video-description");

if (video) {
  const videoSrc = video.src || (VIDEO_BASE_URL ? VIDEO_BASE_URL + id + VIDEO_EXT : "");
  if (videoSrc) player.src = videoSrc;
  titleEl.textContent = video.title;
  descEl.textContent = video.description;
  document.title = video.title;
} else {
  // unknown id
  titleEl.textContent = "VIDEO NOT FOUND";
  descEl.textContent = "VIDEO ID \"" + id + "\" WAS NOT FOUND.";
  document.title = "ERROR 404 NOT FOUND";
}
</script>

</body>
</html>
