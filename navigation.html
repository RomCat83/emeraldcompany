<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMRCS Episodes</title>
    <style>
        html, body {
            margin: 0;
        }

        body {
            /* Centers the icon row in the middle of the page, horizontally and vertically */
            min-height: 100vh;
            box-sizing: border-box;
            padding: 90px 20px; /* equal top/bottom so the center stays true */
            font-family: "Times New Roman", Times, serif;
            display: flex;
            align-items: center;
            justify-content: center;

            background-image: url("images/MRCBG\ V2.png"); /* Replace with your image path */
            background-repeat: repeat;
            animation: moveBackground 10s linear infinite;
        }

        @keyframes moveBackground {
            from {
                background-position: 0 0;
            }
            to {
                background-position: 100% 0; /* Moves horizontally */
            }
        }

        /* Logo stays pinned to the top so it doesn't push the icons off-center */
        header {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            text-align: center;
        }

        .stage {
            position: relative;
        }

        /* Heading sits directly above the icons without shifting them */
        .stage h1 {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            margin: 0 0 24px;
            padding: 0 20px;
            box-sizing: border-box;
            text-align: center;
            font-family: "Times New Roman", Times, serif;
            font-size: clamp(1.4rem, 3vw, 2.5rem);
            color: #ffffff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        /* Text sits directly below the icons without shifting them */
        .stage .below {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            margin: 24px 0 0;
            padding: 0 20px;
            box-sizing: border-box;
            text-align: center;
            font-family: "Times New Roman", Times, serif;
            font-size: clamp(1rem, 2vw, 1.75rem);
            color: #ffffff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        .icons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .icons img {
            display: block;
            width: clamp(150px, 25vw, 400px);
            height: auto;
            position: relative;
            transition: transform 0.25s ease; /* smooth grow and shrink */
        }

        /* Grows while hovered, returns to normal size when the mouse leaves */
        .icons img:hover {
            transform: scale(1.1);
            z-index: 1;
        }

        /* On small screens the icons wrap, so let the heading and text flow normally */
        @media (max-width: 700px) {
            .stage h1 {
                position: static;
                transform: none;
                width: auto;
                margin-bottom: 24px;
            }

            .stage .below {
                position: static;
                transform: none;
                width: auto;
                margin-top: 24px;
            }
        }
    </style>
</head>
<body>
    <audio src="https://file.garden/assMXq6Leqme0FnX/PREVIEW2MIITUBE.mp3" autoplay loop></audio>

    <header>
        <a href="index.html">
            <img id="return-to-root-page" src="images/logo.png" alt="Logo" width="300" height="50">
        </a>
    </header>

    <main class="stage">
        <h1>Select Which EmCo Subject You Want To See</h1>

        <div class="icons">
            <a href="index.html"><img id="one" src="images/WiiU-Icon.png" alt="Subject one"></a>
            <a href="neutralstrawberry.html"><img id="two" src="images/neural-strawberry-icon.png" alt="Subject two"></a>
            <a href="index.html"><img id="three" src="images/WiiU-Icon.png" alt="Subject three"></a>
        </div>

        <p class="below">Your text here</p>
    </main>
</body>
</html>
